[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelpool"
version = "1.2.0"
description = "PZ data challenge entry (all four task sets): FlexZBoost + GPz pool with weights and calibration fitted through the many-band label-noise kernel; BPZ template mixture at the faint end of task set 2"
readme = "README.md"
requires-python = ">=3.11"
# The five pinned packages decide whether the shipped model bundles (pickled FlexZBoost/flexcode/xgboost and GPz models,
# qp ensembles) load; they are the versions of the environment the bundles were built in (environment_desc-pz.txt).
# The rest is left to the resolver so that the package installs next to the organizers' harness.
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "pyyaml",
    "astropy",
    "matplotlib",
    "tables-io",
    "pz-rail-base",
    "qp-prob==1.1.4",
    "flexcode==0.2.3",
    "xgboost==3.4.1",
    "pz-rail-flexzboost==2.0.3",
    "pz-rail-gpz_v1==2.0.3",
    "pz-rail-bpz==2.2.0",
    "desc-bpz==0.4.0",
]

[tool.setuptools.packages.find]
include = ["kernelpool", "kernelpool.pilot"]

[tool.setuptools.package-data]
"kernelpool.pilot" = ["catalogs.yaml", "bpz_data/SED/*", "bpz_data/FILTER/*", "bpz_data/AB/*"]
